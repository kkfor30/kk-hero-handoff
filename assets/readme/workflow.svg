<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">KK Hero Handoff — 从视频到网页</title>
<desc id="desc">三阶段示意：视频居中播放，舞台缩小回位，文字与静态首屏接管。这是机制示意，不是真实页面截图。</desc>
<rect width="1200" height="470" rx="24" fill="#fdfcf9"/>
<g font-family="Microsoft YaHei,PingFang SC,Segoe UI,sans-serif" fill="#101111">
<text x="52" y="72" font-size="42" font-weight="700">让入场动画，停进你的首页。</text>
<text x="52" y="108" font-size="20" fill="#756e61">视频负责动作，网页负责回位与交接 · 机制示意，非实际截图</text>
<g id="centered-video">
<rect x="52" y="155" width="324" height="214" rx="12" fill="#fffefa" stroke="#e5dfd2"/>
<rect x="111" y="187" width="206" height="148" rx="8" fill="#ffedbf"/>
<path d="M206 208 L206 238 L231 223 Z" fill="#a77423"/>
<text x="214" y="286" text-anchor="middle" font-size="28" font-weight="600">场景视频</text>
<text x="214" y="416" text-anchor="middle" font-size="32" font-weight="600">① 居中播放</text>
</g>
<path d="M390 261 H426 M416 251 L428 261 L416 271" fill="none" stroke="#a77423" stroke-width="3"/>
<g id="return-to-layout">
<rect x="438" y="155" width="324" height="214" rx="12" fill="#fffefa" stroke="#e5dfd2"/>
<rect x="482" y="181" width="206" height="148" rx="8" fill="none" stroke="#c8b78f" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="591" y="230" width="143" height="107" rx="6" fill="#ffedbf"/>
<path d="M550 204 Q597 200 623 240 M609 235 L626 245 L624 226" stroke="#a77423" stroke-width="3" fill="none"/>
<text x="663" y="291" text-anchor="middle" font-size="25" font-weight="600">同一场景</text>
<text x="600" y="416" text-anchor="middle" font-size="32" font-weight="600">② 缩小回位</text>
</g>
<path d="M776 261 H812 M802 251 L814 261 L802 271" fill="none" stroke="#a77423" stroke-width="3"/>
<g id="static-handoff">
<rect x="824" y="155" width="324" height="214" rx="12" fill="#fffefa" stroke="#e5dfd2"/>
<rect x="977" y="230" width="143" height="107" rx="6" fill="#ffedbf"/>
<text x="1048" y="291" text-anchor="middle" font-size="25" font-weight="600">静态接管</text>
<text x="851" y="245" font-size="26" font-weight="700">你的</text>
<text x="851" y="282" font-size="26" font-weight="700">首页标题</text>
<path d="M853 318 H946" stroke="#e8b853" stroke-width="5"/>
<text x="986" y="416" text-anchor="middle" font-size="32" font-weight="600">③ 首页就位</text>
</g>
</g>
</svg>
